{% comment %}
Reusable messages template for consistent message display across all pages
Include this template in any page that needs to display messages
{% endcomment %}

{% if messages %}
    <div class="messages-container mb-3">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" 
                 role="alert" 
                 id="message-{{ forloop.counter }}"
                 data-auto-dismiss="true">
                
                <!-- Message Icon -->
                <i class="fas 
                    {% if message.tags == 'error' or message.tags == 'danger' %}
                        fa-exclamation-triangle text-danger
                    {% elif message.tags == 'success' %}
                        fa-check-circle text-success
                    {% elif message.tags == 'warning' %}
                        fa-exclamation-circle text-warning
                    {% else %}
                        fa-info-circle text-info
                    {% endif %}
                "></i>
                
                <!-- Message Content -->
                <span class="message-text">{{ message }}</span>
                
                <!-- Close Button -->
                <button type="button" 
                        class="btn-close" 
                        data-bs-dismiss="alert" 
                        aria-label="Close">
                </button>
            </div>
        {% endfor %}
    </div>

    <script>
    // Auto-dismiss messages after 5 seconds
    document.addEventListener('DOMContentLoaded', function() {
        const messages = document.querySelectorAll('[data-auto-dismiss="true"]');
        
        messages.forEach(function(message, index) {
            // Stagger the auto-dismiss timing for multiple messages
            setTimeout(function() {
                if (message && message.classList.contains('show')) {
                    const alert = new bootstrap.Alert(message);
                    alert.close();
                }
            }, 5000 + (index * 500)); // 5s + 0.5s per additional message
        });
    });
    </script>

    <style>
    .messages-container {
        position: relative;
        z-index: 1050;
    }
    
    .alert {
        border-left: 4px solid;
        border-radius: 0.375rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
    }
    
    .alert-success {
        border-left-color: #198754;
        background-color: #d1e7dd;
        color: #0f5132;
    }
    
    .alert-danger, .alert-error {
        border-left-color: #dc3545;
        background-color: #f8d7da;
        color: #721c24;
    }
    
    .alert-warning {
        border-left-color: #ffc107;
        background-color: #fff3cd;
        color: #664d03;
    }
    
    .alert-info {
        border-left-color: #0dcaf0;
        background-color: #d1ecf1;
        color: #055160;
    }
    
    .message-text {
        margin-left: 0.5rem;
        font-weight: 500;
    }
    
    .alert i {
        margin-right: 0.5rem;
    }
    
    /* Animation for message appearance */
    .alert.fade.show {
        animation: slideInDown 0.3s ease-out;
    }
    
    @keyframes slideInDown {
        from {
            transform: translateY(-20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    </style>
{% endif %}
